[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "isca-tools"
version = "0.1.0"
description = "Tools for analysing Isca climate simulations"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "isca_tools",
    "isca_tools.*",
    "jobs",
    "jobs.*",
]
namespaces = true